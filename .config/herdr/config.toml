onboarding = false

[keys]
prefix = "ctrl+a"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+minus"
switch_workspace = "prefix+1..9"
focus_agent = "prefix+alt+1..9"
new_workspace = "prefix+c"

# Disables default handlers so the plugin can intercept keys first
focus_pane_left  = ""
focus_pane_down  = ""
focus_pane_up    = ""
focus_pane_right = ""

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

# Workspace numbers from the linjiang82.ws-numbering plugin
[ui.sidebar.spaces]
rows = [["state_icon", { token = "$num", fg = "#888888" }, "workspace"], ["branch", "git_status"]]
